<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>榫合 · Joinery</title>
    <meta
      name="description"
      content="把一艘中国古船拆开：榫头与卯眼、铁钉与捻缝、水密隔舱，以及「榫卯」这个词如何穿过语言。Take a Chinese ship apart."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%233A2A20'/%3E%3Cpath d='M8 22 L16 8 L24 22 Z' fill='none' stroke='%23C08A4A' stroke-width='2'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="intro" id="intro" hidden>
      <div class="intro-inner">
        <p class="intro-eyebrow" id="intro-eyebrow"></p>
        <h1 class="intro-title" id="intro-title"></h1>
        <p class="intro-sub" id="intro-sub"></p>
        <p class="intro-note" id="intro-note"></p>
        <button class="intro-start" id="intro-start" type="button"></button>
        <div class="intro-mode" id="intro-mode" role="group" aria-label="显示方式">
          <button class="intro-mode-btn is-active" type="button" data-mode="3d">3D</button>
          <button class="intro-mode-btn" type="button" data-mode="2d">2D</button>
        </div>
      </div>
    </div>

    <header class="topbar">
      <span class="topbar-mark" aria-hidden="true">榫合 · Joinery</span>
      <span class="topbar-beat" id="beat-indicator" aria-hidden="true"></span>
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="切换到英文">EN</button>
      <div class="progress" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressbar">
        <span class="progress-fill" id="progress-fill"></span>
      </div>
    </header>

    <main class="story" id="story">
      <div class="stage" id="stage" role="group" tabindex="0" aria-label="舞台">
        <canvas class="stage-canvas" id="stage-canvas" role="img" aria-label="舞台"></canvas>
        <img class="stage-fallback" id="stage-fallback" alt="" loading="lazy" hidden />

        <div class="part-label" id="part-label" hidden></div>
        <div class="seal" id="seal" aria-hidden="true"></div>

        <section class="copy" id="copy" aria-live="polite">
          <p class="copy-eyebrow" id="copy-eyebrow"></p>
          <h1 class="copy-title" id="copy-title"></h1>
          <div class="copy-body" id="copy-body"></div>
          <p class="copy-hint" id="copy-hint" hidden></p>

          <div class="caulk" id="caulk-ui" hidden>
            <div class="caulk-steps" role="group" aria-label="补缝步骤" id="caulk-steps"></div>
            <p class="caulk-status" id="caulk-status" role="status"></p>
          </div>

          <div class="flood" id="flood-ui" hidden>
            <div class="flood-switch" role="group" id="flood-switch" aria-label="漏水实验开关">
              <button type="button" class="flood-btn" data-flood="with-bulkheads"></button>
              <button type="button" class="flood-btn" data-flood="without-bulkheads"></button>
            </div>
          </div>

          <div class="terms" id="terms-ui" hidden>
            <h2 class="terms-title" id="terms-title"></h2>
            <ul class="terms-list" id="terms-list"></ul>
          </div>

          <div class="coda" id="coda-ui" hidden>
            <div class="quiz" id="quiz">
              <p class="quiz-step" id="quiz-step"></p>
              <p class="quiz-q" id="quiz-q"></p>
              <div class="quiz-opts" id="quiz-opts" role="group"></div>
              <p class="quiz-why" id="quiz-why" role="status" aria-live="polite" hidden></p>
              <button type="button" class="quiz-next" id="quiz-next" hidden></button>
              <p class="quiz-score" id="quiz-score" hidden></p>
            </div>
            <p class="credits" id="credits"></p>
            <button type="button" class="replay" id="replay"></button>
          </div>
        </section>
      </div>
      <!-- 滚动区间由 main.js 按 beats.js 的 progress 占比生成 -->
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
